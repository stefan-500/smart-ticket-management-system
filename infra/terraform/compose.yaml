name: smart-ticket-demo

services:
  db:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in app.env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in app.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in app.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in app.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Runs on fresh and existing databases, before the backend can accept tickets.
  db-init:
    image: mysql:9.7.2
    restart: "no"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ./init-db.sql:/init-db.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mysql --protocol=TCP -h db -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" < /init-db.sql
        test "$$(mysql --protocol=TCP -h db -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -Nse 'SELECT COUNT(*) FROM assignment_lock WHERE id = 1')" = 1
        echo 'Verified assignment_lock.id = 1'
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:?Set DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Set DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      SERVER_PORT: "8080"
      APP_CORS_ALLOWED_ORIGINS: ${APP_URL:?Set APP_URL to the Terraform app_url}
      SECURITY_JWT_COOKIE_SECURE: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /v3/api-docs HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy
        restart: true

volumes:
  mysql_data:
